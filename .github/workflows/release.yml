name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Web UI
        run: |
          make ui

      - name: Verify Quality Gates
        run: |
          make check

      - name: Build Release Binaries
        run: |
          mkdir -p bin
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/r3p-dev/dermaga/internal/name.VersionOverride=${VERSION}"
          
          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/dermaga-linux-amd64 ./cmd/dermaga
          
          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/dermaga-linux-arm64 ./cmd/dermaga

      - name: Generate Checksums
        run: |
          cd bin
          sha256sum dermaga-linux-amd64 dermaga-linux-arm64 > checksums.txt
          echo "Release checksums generated:"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            bin/dermaga-linux-amd64
            bin/dermaga-linux-arm64
            bin/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
