name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Web UI
        run: |
          make ui

      - name: Verify Quality Gates
        run: |
          make check

      - name: Build Release Binaries
        run: |
          mkdir -p bin
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/r3p-dev/dermaga/internal/name.VersionOverride=${VERSION}"
          
          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/dermaga-linux-amd64 ./cmd/dermaga
          
          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/dermaga-linux-arm64 ./cmd/dermaga

      - name: Generate Checksums
        run: |
          cd bin
          sha256sum dermaga-linux-amd64 dermaga-linux-arm64 > checksums.txt
          echo "Release checksums generated:"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/dermaga-linux-amd64
            bin/dermaga-linux-arm64
            bin/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
